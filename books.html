<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Books</title>
    <meta name="description" content="Books loaded from the published portfolio sheet.">
    <link rel="canonical" href="">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=Cinzel:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="libs/font-awesome/css/font-awesome.min.css">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=6">
    <link rel="stylesheet" href="css/celestial.css?v=1">
    <link rel="stylesheet" href="css/sheet-content.css?v=3">
</head>
<body class="subpage celestial-theme">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header>
        <div class="container">
            <div class="logo"><a href="index.html">Portfolio</a></div>
            <ul id="menu">
                <li><a href="index.html">Home</a></li>
                <li class="more-menu"><details class="more-menu-dropdown">
                    <summary class="more-toggle" aria-haspopup="true" aria-expanded="false"><span>More</span><i class="fa fa-angle-down more-caret" aria-hidden="true"></i></summary>
                    <div class="more-pop-card" role="menu" aria-label="More menu">
                        <a href="books.html" role="menuitem" class="is-active" aria-current="page">Books</a>
                        <a href="tools.html" role="menuitem">Tools</a>
                        <a href="if-else.html" role="menuitem">IF-ELSE</a>
                    </div>
                </details></li>
            </ul>
        </div>
    </header>
    <main id="main-content" class="container sheet-subpage">
        <div id="content-status" class="content-status" role="status" aria-live="polite">Loading published content...</div>
        <noscript><p>Enable JavaScript to load the published bookshelf.</p></noscript>
        <div class="subpage-breadcrumb"><span class="runtime-dot" aria-hidden="true"></span></div>
        <div class="page-head reveal" data-reveal="up">
            <span class="hero-tag"><i class="fa fa-star-o" aria-hidden="true"></i></span>
            <h1 class="page-title" data-content-loading>Loading books...</h1>
            <p class="page-intro"></p>
        </div>
        <div class="row book-grid"></div>
        <div class="book-request-footer">
            <p class="typing-container" data-site-copy="footer_typing_text"></p>
            <i class="fa fa-file-text" aria-hidden="true"></i>
            <p data-site-copy="format_request.1"></p>
            <p data-site-copy="format_request.2"></p>
            <a href="index.html#contact" class="btn-fun" data-site-copy="format_request.3"></a>
        </div>
    </main>
    <div class="back-home-wrap"><a class="back-home" href="index.html"><i class="fa fa-arrow-left" aria-hidden="true"></i> Return to the Observatory</a></div>
    <footer><div class="container sheet-footer"><div class="social-icons"></div><p></p></div></footer>
    <dialog id="book-editions" aria-labelledby="edition-title">
        <div class="browser-card">
            <div class="browser-header"><span>Choose your edition</span><button type="button" class="btn-text" aria-label="Close version selector">Close</button></div>
            <div class="browser-content"><h3 id="edition-title"></h3><div class="edition-links"></div></div>
        </div>
    </dialog>
    <script src="js/sheet-source.js?v=3" defer></script>
    <script src="js/site-content.js?v=3" defer></script>
    <script src="js/nav-dropdown.js?v=6" defer></script>
    <script src="js/subpage.js?v=7" defer></script>
</body>
</html>
