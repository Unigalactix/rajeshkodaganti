name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install validation dependencies
        run: pip install -r requirements.txt

      - name: Snapshot published Google Sheets
        run: node scripts/export-sheet-data.js --output .sheet-build/data.json

      - name: Test Google Sheets loader
        run: node --test scripts/sheet-source.test.js

      - name: Test resume and validation helpers
        run: python -m unittest discover -s tests -p "test_sheet_build.py"

      - name: Generate resumes
        run: python build_resume.py --data .sheet-build/data.json

      - name: Validate portfolio
        env:
          CHECK_EXTERNAL_LINKS: "1"
        run: python scripts/validate_portfolio.py --data .sheet-build/data.json

      - name: Remove ephemeral spreadsheet snapshot
        if: always()
        run: rm -rf .sheet-build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
